<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Tournaments Help - SAS VEX Robotics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%230F1113'/><rect x='0' y='88' width='100' height='12' fill='%233DDC97'/><text x='50' y='68' font-family='Arial' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>SV</text></svg>">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #061A1C;
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --border-color: #1E2C31;
            --border-hover: #2d4048;
            --shadow-sm: rgba(0,0,0,0.15) 0px 0px 0px 1px, rgba(255,255,255,0.03) 0px 1px 0px inset;
            --shadow-md: rgba(0,0,0,0.15) 0px 0px 0px 1px, rgba(0,0,0,0.12) 0px 2px 2px, rgba(0,0,0,0.10) 0px 4px 4px, rgba(0,0,0,0.08) 0px 8px 8px, rgba(255,255,255,0.03) 0px 1px 0px inset;
            --shadow-lg: rgba(0,0,0,0.35) 0px 25px 50px -12px;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --transition-fast: 0.15s ease;
            --transition-smooth: 0.3s ease;
            --accent-1: #36F4A4;
            --accent-2: #C1FBD4;
            --accent-3: #A1A1AA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg-primary);
            font-family: var(--font-main);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1.25rem 2rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .nav-logo span {
            font-weight: 400;
            color: var(--text-secondary);
        }

        .back-link {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .byline {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        /* Content Sections */
        .content-section {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .content-section h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .content-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 1.5rem 0 0.75rem;
        }

        .content-section p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .content-section ul, .content-section ol {
            color: var(--text-secondary);
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .content-section li {
            margin-bottom: 0.5rem;
        }

        .content-section a {
            color: var(--accent-1);
            text-decoration: none;
        }

        .content-section a:hover {
            text-decoration: underline;
        }

        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            margin-top: 4rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 6rem 1.25rem 3rem;
            }

            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="nav-logo">SAS<span>VEX</span></a>
            <a href="/competitions.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Tools
            </a>
        </div>
    </nav>

    <div class="container">
        <header>
            <p class="byline">By Dan Honda</p>
            <h1>Running Tournaments Help</h1>
            <p class="subtitle">A guide to running VEX Robotics competitions</p>
        </header>

        <div class="content-section">
            <div class="video-container">
                <iframe
                    src="https://www.youtube.com/embed/JOCHePdNb1E"
                    title="Running Tournaments Help"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

    </div>

    <footer class="footer">
        <p>&copy; 2026 SAS VEX Robotics. Made by Dan Honda.</p>
    </footer>
</body>
</html>
